<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .carousel{
            position: relative;
            display:flex;
            width: 800px;
            height: 230px;
            background-color: #087f5b;
            color: #ffffff;
            font-family: sans-serif;
            border-radius: 8px;
            margin: 100px auto;
            justify-content: space-evenly;
            gap:60px;
            align-items: center;
            padding: 40px;
            margin-bottom: 30px;
            
        }


        .carousel_photo{
            /* position: absolute; */
            height: 200px;
            transform: scale(1.3);
            box-shadow: 0 12px 24px rgba(0,0,0,0.75);
            border-radius: 8px;
            display: flex;
            justify-content: flex-start;
            margin-left: 25px;
           
            
            
        }

        .testimonials{
            display: flex;
            flex-direction: column;
            justify-content:center;
            align-items: flex-start;
            gap: 30px;
        }

        blockquote{
            line-height: 1.3;
           }

        .customer{
            line-height: 1.6;
            
        }
        .name,
        .designation{
            font-weight: 200;
        }

        .slide-left{
            position: absolute;
            /* display: flex;
            align-items: center;
            justify-content: center; */
            /* left:-12px; */
            left: 0;
            top:50%;
            transform: translate(-50%,-50%);
            width: 23px;
            stroke: #087f5b;
            stroke-width: 2px;
            background-color: #f7f6f6;
            border-radius: 50%;
            padding: 3px;
           box-shadow: 2px 2px 35px 2px rgba(0,0,0,0.75);
             cursor: pointer;
         }

        .slide-right{
            position: absolute;
            top:50%;
            right: 0px;
            transform: translate(50%,-50%);
            width: 23px;
            stroke: #087f5b;
            stroke-width: 2px;
            background-color: #f7f6f6;
            border-radius: 50%;
            padding: 3px;
            box-shadow: 2px 2px 35px 2px rgba(0,0,0,0.75);
             cursor: pointer;
        }

        .carousel_dots{
            position: relative;
            display: flex;
            flex-direction: row;
            gap:10px;
            justify-content: center;
            align-items: center;
            margin-top: 0%;

           
        } 

        .dot1,.dot2, .dot3, .dot4 {
            cursor: pointer;
            width: 5px;
            height: 5px;
            border: 2px solid #087f5b;
            border-radius: 50%;
            padding: 3px;
        } 

         .dot1{
            background-color: #087f5b;
         }
        


    </style>
    <title>Carousel</title>
</head>
<body>
    <div class="carousel">

        



        <img src="maria.jpg" alt="maria davis" class="carousel_photo">
        <div class="testimonials">
        <blockquote>"Lorem ipsum dolor sit, amet consectetur adipisicing elit. Accusantium laborum ea animi vel placeat reprehenderit porro rem a repudiandae.
        Et eaque voluptatibus ipsam a tempore doloribus debitis voluptas voluptatum accusantium."</blockquote>
        <div class="customer">
            <p class="name">Maria Database</p>
            <p class="designation">Senior Database Engineer at Amazon</p>
        </div>

        <svg class="slide-left" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
</svg>

        <svg class="slide-right" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
</svg>




        </div>
       
    </div>
     <div class="carousel_dots">
<button class="carousel_dots dot1"></button>
<button class="carousel_dots dot2"></button>
<button class="carousel_dots dot3"></button>
<button class="carousel_dots dot4"></button>

</div>
</body>
</html>
